{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card">
  <h1>Create your account</h1>
  <p class="subtitle">You'll use this to give and receive feedback.</p>
  <form method="post">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ name or '' }}" autocomplete="name" required>

    <label for="email">Work email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
    <p class="muted">At least 8 characters.</p>

    <div class="btn-row">
      <button class="btn" type="submit">Sign up</button>
    </div>
  </form>
  <p class="muted" style="margin-top:16px;">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  <p class="muted">Curious how the anonymity actually works? <a href="{{ url_for('faq') }}">Read the FAQ</a></p>
</div>
{% endblock %}
