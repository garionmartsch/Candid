{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <form method="post">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <div class="btn-row">
      <button class="btn" type="submit">Log in</button>
    </div>
  </form>
  <p class="muted" style="margin-top:16px;">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
</div>
{% endblock %}
