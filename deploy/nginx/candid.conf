# Reverse proxy + TLS termination for Candid, using your team's existing
# internal certificate (not a public one — this is an internal tool).
#
# Where this goes with Homebrew nginx:
#   Apple Silicon: /opt/homebrew/etc/nginx/servers/candid.conf
#   Intel Mac:     /usr/local/etc/nginx/servers/candid.conf
# (Homebrew's default nginx.conf includes servers/*.conf already — check
# yours with `nginx -T | grep include` if you're not sure.)
#
# Before using this file, replace:
#   REPLACE_WITH_INTERNAL_HOSTNAME   e.g. candid.internal.yourteam.com
#   REPLACE_WITH_CERT_PATH           your internal cert (fullchain) .pem/.crt
#   REPLACE_WITH_KEY_PATH            that cert's private key
# Then test and reload:
#   nginx -t && brew services restart nginx

server {
    listen 80;
    server_name REPLACE_WITH_INTERNAL_HOSTNAME;
    # Plain HTTP just redirects — real traffic should always be HTTPS, even
    # internally, since login passwords and feedback text cross this.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_INTERNAL_HOSTNAME;

    ssl_certificate     REPLACE_WITH_CERT_PATH;
    ssl_certificate_key REPLACE_WITH_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Candid itself never sees the request body beyond a short text field,
    # so there's no need for a large client_max_body_size here.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NOT logging request bodies here (see the README's
        # "How the anonymity actually works" section) — nginx doesn't log
        # bodies by default, so this is a reminder not to add
        # $request_body to any custom log_format later.
    }
}
